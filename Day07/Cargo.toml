[package]
name = "rust_rent"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-otel-metrics = { version = "0.14.1", default-features = false, optional = true }
axum-tracing-opentelemetry = { version = "0.39.0", default-features = false, optional = true }
chrono = { version = "0.4.45", features = ["serde"] }
opentelemetry = { version = "0.32.0", default-features = false, optional = true }
opentelemetry-prometheus = { version = "0.32.0", default-features = false, optional = true }
opentelemetry-semantic-conventions = { version = "0.32.0", default-features = false, optional = true }
opentelemetry_sdk = { version = "0.32.1", default-features = false, optional = true }
opentelemetry-otlp = { version = "0.32.0", default-features = false, optional = true }
opentelemetry-zipkin = { version = "0.32.0", default-features = false, optional = true }
prometheus = { version = "0.14.0", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = { version = "0.1.44", default-features = false, optional = true }
tracing-appender = { version = "0.2.5", default-features = false, optional = true }
tracing-opentelemetry = { version = "0.33.0", default-features = false, optional = true }
tracing-subscriber = { version = "0.3.23", default-features = false, optional = true }


[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
